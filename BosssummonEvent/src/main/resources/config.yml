# =========================================================
#  BossSummonEvent - config.yml
#  Dinh nghia cac su kien trieu hoi boss MythicMobs
# =========================================================

# Ngon ngu dung '&' cho ma mau (auto duoc dich sang ChatColor / MiniMessage-friendly).
# Dat tat ca su kien trong muc "events". Key la ID su kien (dung trong lenh /bosssummon start <id>).

events:

  ancient_dragon:
    display-name: "&6&lRong Co Dai"

    # Thoi gian toi da (giay) de hoan thanh dieu kien, qua thoi gian se TU DONG HUY su kien.
    time-limit-seconds: 600

    # Cau hinh BossBar hien thi tien trinh cho tat ca nguoi choi trong the-gioi cua diem trieu hoi
    bossbar:
      title: "&e{display_name} &7- &f{current}&7/&f{required} &7({time_left}s)"
      color: RED          # PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
      style: SEGMENTED_10  # SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20

    # Dieu kien de kich hoat trieu hoi: tieu diet cac loai quai (MythicMobs hoac Vanilla)
    # type: MYTHIC  -> id la Internal Name cua MythicMob (khong phan biet hoa/thuong)
    # type: VANILLA -> id la ten EntityType cua Bukkit (VD: ZOMBIE, SKELETON, SPIDER...)
    requirements:
      - type: MYTHIC
        id: SkeletalKnight
        amount: 20
      - type: MYTHIC
        id: FireImp
        amount: 15
      - type: VANILLA
        id: ZOMBIE
        amount: 30

    # Vi tri va danh sach mob se duoc trieu hoi khi hoan thanh du dieu kien
    summon:
      location:
        world: world
        x: 100.5
        y: 70.0
        z: 200.5
        yaw: 0.0
        pitch: 0.0
      mobs:
        - id: AncientDragonBoss
          amount: 1
        - id: DragonGuard
          amount: 4

    # Hieu ung khi trieu hoi thanh cong
    success-effects:
      title: "&4&lBOSS DA XUAT HIEN!"
      subtitle: "&cHay chuan bi chien dau..."
      title-fade-in: 10
      title-stay: 60
      title-fade-out: 20
      broadcast-message: "&6[Su Kien] &fRong Co Dai da duoc trieu hoi tai &e{world}&f!"
      sound:
        name: ENTITY_ENDER_DRAGON_GROWL
        volume: 3.0
        pitch: 1.0
      particles:
        - particle: FLAME
          count: 250
          offset-x: 3.0
          offset-y: 3.0
          offset-z: 3.0
          speed: 0.15
        - particle: EXPLOSION
          count: 6
          offset-x: 1.0
          offset-y: 1.0
          offset-z: 1.0
          speed: 0.0
        - particle: LARGE_SMOKE
          count: 80
          offset-x: 2.0
          offset-y: 2.0
          offset-z: 2.0
          speed: 0.05
      firework: true
      firework-count: 6
      firework-radius: 3.0

    # Thong bao khi su kien het thoi gian ma chua du dieu kien
    fail:
      broadcast-message: "&c[Su Kien] &fSu kien trieu hoi Rong Co Dai da that bai vi het thoi gian!"
      sound:
        name: ENTITY_VILLAGER_NO
        volume: 1.0
        pitch: 1.0

# Cau hinh thong bao tien trinh dang action-bar/chat khi giet quai hop le (tuy chon)
progress-notify:
  enabled: true
  action-bar: "&a+1 &7({mob}) &f- &e{current}&7/&f{required}"